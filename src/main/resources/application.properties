# =============================================
# DevPulse Configuration
# All secrets come from environment variables
# =============================================

spring.application.name=devpulse

# MongoDB (use Atlas connection string in production)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/devpulse}

# GitHub API Token (generate at github.com/settings/tokens)
github.api.token=${GITHUB_TOKEN}
github.api.base-url=https://api.github.com

# Repositories to monitor (comma-separated: owner/repo)
github.repos.watch=${GITHUB_REPOS:spring-projects/spring-boot,docker/compose}

# Scheduling: how often to scrape (cron expression)
# Default: every 15 minutes
scraper.cron=${SCRAPER_CRON:0 */15 * * * *}

# Alert thresholds
alert.stale-pr.days=${ALERT_STALE_PR_DAYS:7}
alert.health-score.min=${ALERT_HEALTH_MIN:60}
alert.open-issues.max=${ALERT_OPEN_ISSUES_MAX:50}

# Email alerts (optional - leave blank to disable)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
alert.email.enabled=${ALERT_EMAIL_ENABLED:false}
alert.email.to=${ALERT_EMAIL_TO:}

# Slack alerts (optional - leave blank to disable)
alert.slack.enabled=${ALERT_SLACK_ENABLED:false}
alert.slack.webhook-url=${SLACK_WEBHOOK_URL:}

# Server
server.port=${PORT:8080}

# Logging
logging.level.com.devpulse=INFO
