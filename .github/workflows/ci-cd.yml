name: DevPulse CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------
  # 1. Test
  # -------------------------------------------------------
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test --no-transfer-progress
        env:
          # Provide a dummy token so Spring context starts in tests
          GITHUB_TOKEN: test-token
          MONGODB_URI: mongodb://localhost:27017/devpulse-test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

  # -------------------------------------------------------
  # 2. Build Docker image
  # -------------------------------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests --no-transfer-progress
        env:
          GITHUB_TOKEN: test-token
          MONGODB_URI: mongodb://localhost:27017/devpulse-test

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/devpulse:latest
            ${{ secrets.DOCKER_USERNAME }}/devpulse:${{ github.sha }}

  # -------------------------------------------------------
  # 3. Deploy to AWS EC2
  # -------------------------------------------------------
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull latest image
            docker pull ${{ secrets.DOCKER_USERNAME }}/devpulse:latest

            # Stop existing container gracefully
            docker stop devpulse || true
            docker rm devpulse || true

            # Start new container with environment variables from EC2
            docker run -d \
              --name devpulse \
              --restart unless-stopped \
              -p 8080:8080 \
              -e GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN_PROD }} \
              -e MONGODB_URI=${{ secrets.MONGODB_URI }} \
              -e GITHUB_REPOS=${{ secrets.GITHUB_REPOS }} \
              -e ALERT_EMAIL_ENABLED=${{ secrets.ALERT_EMAIL_ENABLED }} \
              -e ALERT_EMAIL_TO=${{ secrets.ALERT_EMAIL_TO }} \
              -e MAIL_HOST=${{ secrets.MAIL_HOST }} \
              -e MAIL_USER=${{ secrets.MAIL_USER }} \
              -e MAIL_PASS=${{ secrets.MAIL_PASS }} \
              -e SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }} \
              ${{ secrets.DOCKER_USERNAME }}/devpulse:latest

            echo "DevPulse deployed successfully"
            docker ps | grep devpulse
